yaml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyflow_postgres
    environment:
      POSTGRES_USER: studyflow
      POSTGRES_PASSWORD: studyflow
      POSTGRES_DB: studyflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./crates/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyflow -d studyflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studyflow_network

  postgres_test:
    image: postgres:16-alpine
    container_name: studyflow_postgres_test
    environment:
      POSTGRES_USER: studyflow_test
      POSTGRES_PASSWORD: studyflow_test
      POSTGRES_DB: studyflow_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyflow_test -d studyflow_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studyflow_network

volumes:
  postgres_data:
    driver: local

networks:
  studyflow_network:
    driver: bridge