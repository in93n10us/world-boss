toml
[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/db",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["StudyFlow Team"]
license = "MIT"
repository = "https://github.com/studyflow/studyflow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id", "util"] }
hyper = { version = "1.0" }

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "chrono",
    "uuid",
    "json",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Configuration
dotenvy = "0.15"
config = "0.14"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Testing
mockall = "0.12"

# Internal workspace crates
studyflow-api = { path = "crates/api" }
studyflow-core = { path = "crates/core" }
studyflow-db = { path = "crates/db" }

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 1

[profile.bench]
opt-level = 3