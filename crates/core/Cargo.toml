toml
[package]
name = "studyflow-core"
version = "0.1.0"
edition = "2021"
authors = ["StudyFlow Team"]
description = "Core business logic and domain models for StudyFlow"
license = "MIT"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID support for entity IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime (for trait bounds)
tokio = { version = "1.35", features = ["macros"] }

[dev-dependencies]
# Testing utilities
tokio = { version = "1.35", features = ["full", "test-util"] }
mockall = "0.12"

[lib]
doctest = true